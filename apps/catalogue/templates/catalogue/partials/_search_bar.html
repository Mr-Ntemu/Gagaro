<form action="{% url 'catalogue:listing' %}" method="GET" id="search-form" class="position-relative">
    <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border">
        <span class="input-group-text bg-white border-0 ps-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" name="q" value="{{ search_query }}" class="form-control form-control-lg border-0 py-3" placeholder="Que recherchez-vous aujourd'hui ?" aria-label="Rechercher">
        <button class="btn btn-kadoya px-4 m-1 rounded-pill" type="submit">Rechercher</button>
    </div>
</form>
