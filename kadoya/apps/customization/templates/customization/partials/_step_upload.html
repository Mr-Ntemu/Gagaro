<div class="step-content">
  <h2 class="mb-4">1. Importez votre photo</h2>
  <p class="text-muted mb-4">Choisissez une photo de haute qualité pour un meilleur rendu (min. 800x600 px).</p>

  <form id="upload-form" enctype="multipart/form-data">
    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-content">
        <i class="bi bi-cloud-arrow-up display-1 text-muted"></i>
        <p class="mt-3">Glissez-déposez votre photo ici ou <strong>cliquez pour parcourir</strong></p>
        <span class="text-xs text-muted">{{ upload_form.photo.help_text }}</span>
      </div>
      {{ upload_form.photo }}
    </div>

    <div class="progress mt-4 d-none" id="upload-progress-container">
      <div class="progress-bar progress-bar-striped progress-bar-animated" 
           role="progressbar" id="upload-progress-bar" style="width: 0%">0%</div>
    </div>

    <div id="upload-errors" class="alert alert-danger mt-3 d-none"></div>

    <div class="mt-5 d-flex justify-content-end">
      <button type="button" class="btn btn-primary btn-lg px-5 btn-next" 
              onclick="showStep(2)" {% if not session.is_photo_uploaded %}disabled{% endif %}>
        Continuer <i class="bi bi-arrow-right ms-2"></i>
      </button>
    </div>
  </form>
</div>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('photo-upload-input');

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-active');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-active');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-active');
    const file = e.dataTransfer.files[0];
    if (file) handleFileSelection(file);
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFileSelection(file);
  });

  function handleFileSelection(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('preview-photo').innerHTML =
        `<img src="${e.target.result}" alt="Votre photo" style="width:100%;height:100%;object-fit:cover;">`;
    };
    reader.readAsDataURL(file);

    uploadPhoto(file);
  }

  async function uploadPhoto(file) {
    const formData = new FormData();
    formData.append('photo', file);
    formData.append('csrfmiddlewaretoken', getCsrfToken());

    const xhr = new XMLHttpRequest();
    xhr.open('POST', uploadUrl);

    document.getElementById('upload-progress-container').classList.remove('d-none');
    document.getElementById('upload-errors').classList.add('d-none');

    xhr.upload.addEventListener('progress', (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        updateProgressBar(pct);
      }
    });

    xhr.onload = () => {
      const data = JSON.parse(xhr.responseText);
      if (data.success) {
        document.getElementById('upload-progress-bar').classList.remove('progress-bar-animated');
        document.getElementById('upload-progress-bar').classList.add('bg-success');
        enableNextButton(1);
      } else {
        const errorsDiv = document.getElementById('upload-errors');
        errorsDiv.classList.remove('d-none');
        errorsDiv.innerHTML = '';
        for (const [field, messages] of Object.entries(data.errors)) {
          messages.forEach(m => {
            const p = document.createElement('p');
            p.className = 'mb-0';
            p.textContent = m;
            errorsDiv.appendChild(p);
          });
        }
      }
    };

    xhr.send(formData);
  }
</script>
